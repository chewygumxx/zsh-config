name: Lint Commit Messages

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read
    pull-requests: read

jobs:
    commitlint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.4"

            - name: Bun Install
              run: bun install --frozen-lockfile

            - name: Lint Pull Request Commits
              if: github.event_name == 'pull_request'
              run: bunx --bun --no-install commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

            - name: Lint Pushed Commit
              if: github.event_name != 'pull_request'
              run: bunx --bun --no-install commitlint --last --verbose
