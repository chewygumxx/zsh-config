name: Lint Commit Messages

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read
    pull-requests: read

jobs:
    commitlint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            # actions/setup-node installs whichever npm the chosen node bundles,
            # which for node 24 is npm 11. package.json requires npm 12 for
            # patchedDependencies, and .npmrc sets engine-strict, so npm ci
            # would fail outright without this upgrade.
            - name: Upgrade NPM
              run: npm install --global npm@12

            - name: NPM Clean Install
              run: npm ci

            - name: Lint Pull Request Commits
              if: github.event_name == 'pull_request'
              run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

            - name: Lint Pushed Commit
              if: github.event_name != 'pull_request'
              run: npx commitlint --last --verbose
