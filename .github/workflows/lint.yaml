#
# ~chewygumxx/zsh-config.git
# ::: :/.github/workflows/lint.yaml
#
#

name: Lint and Test

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch: {}

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # lint:syntax runs zsh -n over every shell file and lint:zsh runs
            # shuck, so zsh has to be present. Installed explicitly rather than
            # relied upon, because it is not guaranteed on the runner image.
            - name: Install Zsh
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes zsh

            # Provides bun, actionlint, shuck and yamllint straight from
            # .mise.toml, so CI resolves the same versions a local run does.
            - name: Setup Mise
              uses: jdx/mise-action@v4

            - name: Report tool versions
              run: |
                  bun --version
                  zsh --version
                  yamllint --version

            - name: Install dependencies
              run: mise run setup

            - name: Lint
              run: mise run lint

    test:
        name: Test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Install Zsh
              run: |
                  sudo apt-get update
                  sudo apt-get install --yes zsh

            - name: Setup Mise
              uses: jdx/mise-action@v4

            - name: Install dependencies
              run: mise run setup

            # The suite borrows existing clones rather than letting the
            # configuration fetch them, which is what keeps a test run offline
            # and repeatable. Keyed on the files that decide which plugins are
            # wanted, so adding a spec invalidates the cache.
            - name: Cache plugin clones
              id: plugins
              uses: actions/cache@v6
              with:
                  path: ~/zsh-test-plugins
                  key: zsh-plugins-${{ hashFiles('spec/*.spec.zsh', 'rc/completion.rc.zsh') }}

            # Every spec's slug is read out of spec/, disabled ones included:
            # the enabled=false test in tests/boot.zunit needs a clone present
            # so that only the flag stands between it and loading. A list
            # written out here once missed exactly those.
            #
            # zsh-completions and fzf-tab are cloned by rc/completion.rc.zsh
            # rather than declared in spec/, and fzf-tab only when fzf is on
            # PATH. It is cloned here regardless, so the result does not depend
            # on whether the runner image happens to ship fzf.
            - name: Clone plugins
              if: steps.plugins.outputs.cache-hit != 'true'
              run: |
                  slugs=$(sed -n 's/^local slug="\(.*\)"$/\1/p' spec/*.spec.zsh)
                  mkdir -p ~/zsh-test-plugins
                  cd ~/zsh-test-plugins
                  for slug in $slugs zsh-users/zsh-completions aloxaf/fzf-tab; do
                      git clone --depth 1 "https://github.com/$slug.git"
                  done

            # Read by tests/_support/sandbox.zsh, which symlinks each entry into
            # the throwaway HOME one directory at a time.
            - name: Test
              run: ZSH_TEST_PLUGIN_DIR="$HOME/zsh-test-plugins" mise run test
