# vim:set expandtab shiftwidth=4 filetype=toml:
# SPDX-License-Identifier: GPL-3.0-only

#
#
# ~chewygumxx/zsh-config.git
# ::: :/.mise.toml
#
#

# https://mise.jdx.dev/configuration.html
# https://mise.jdx.dev/tasks/


# ------
# Tools
# ------

[tools]

# Pinned to the version that .github/workflows/commitlint.yaml installs, so
# `bun install` here resolves the same tree CI does.
bun = "1.4"

# Workflow linter. The registry alias resolves to aqua:rhysd/actionlint.
actionlint = "1.7.12"

# Zsh linter and formatter; reads .shuck.toml. Not carried in the mise
# registry, so it is pulled from its GitHub releases directly. The release
# assets are named shuck-cli-*, so the binary has to be named explicitly.
"github:ewhauser/shuck" = { version = "0.2.3", exe = "shuck" }

# YAML linter, a Python tool installed with the uv pinned beside it. Its rules
# come from .yamllint.yaml, which extends @chewygumxx/yamllint-config in
# package.json; Prettier, which formats YAML, is pinned there too.
"aqua:astral-sh/uv" = "0.12.19"
"pypi:yamllint" = "1.38.0"


# --------------
# Task settings
# --------------

[env]

# Puts the dev dependencies' CLIs on PATH for interactive use. The tasks below
# still run them through `bunx --bun`, because their shebangs name node, which
# this file does not provide.
#
# .bin holds zunit and revolver, which the test:deps task fetches because
# neither can come from the tools table above. It is listed second so a
# genuinely installed tool always wins over a downloaded script.
_.path = [
    "{{config_root}}/node_modules/.bin",
    "{{config_root}}/.bin",
]

# Redirected because revolver defaults this to ${ZDOTDIR:-$HOME}/.revolver, and
# ZDOTDIR here is the live configuration directory, which is itself a checkout of
# this repository. Left alone, running zunit without --tap drops state files into
# it and they surface as untracked noise in the wrong clone. The test task passes
# --tap and so never starts revolver at all, but a bare `zunit run` does.
REVOLVER_DIR = "{{config_root}}/tests/_output/revolver"

[task_config]

# Every task globs repo-relative paths, so pin them to the repo root rather
# than to whichever directory `mise run` was invoked from.
dir = "{{config_root}}"


# -------
# Set up
# -------

[tasks.setup]
description = "Install the dev dependencies with Bun, and the Husky hooks"
run = "bun install --frozen-lockfile"

[tasks.commit]
description = "Compose a Conventional Commit through Commitizen"
run = "bunx --bun --no-install cz"


# -------
# Checks
# -------

[tasks.lint]
description = "Run every non-interactive check over the repository"
depends = [
    "lint:zsh",
    "lint:syntax",
    "lint:actions",
    "lint:yaml",
    "lint:types",
    "lint:format",
]

[tasks."lint:zsh"]
description = "Lint the shell sources with shuck, per .shuck.toml"
run = "shuck check"

[tasks."lint:syntax"]
description = "Parse every shell file with zsh -n"
shell = "zsh -c"
run = '''
() {
    emulate -L zsh
    setopt null_glob

    local -a files
    files=(
        .zshenv
        .zshrc
        env/*.env.zsh
        rc/*.rc.zsh
        util/*.rc.zsh
        spec/*.spec.zsh
        comp/*.zsh
        func/*(.)
        wrap/*(.)
        tests/_support/*.zsh
    )

    # The test files themselves are absent on purpose, and this is the one
    # carve-out in this task. A .zunit file is not valid zsh: `@test 'name' {`
    # is zunit's own syntax, and zsh -n rejects it with a parse error at the
    # closing brace. The helpers under tests/_support are ordinary zsh and are
    # checked above.

    local file
    local -i failed=0

    for file in $files; do
        zsh -n -- $file || failed=1
    done

    return $failed
}
'''

[tasks."lint:actions"]
description = "Lint the GitHub Actions workflows"

# The two ignores cover a single known actionlint false positive, already
# annotated in .github/workflows/sync-repo-metadata.yaml: actionlint reads a
# stale input list for actions/create-github-app-token@v3, where `client-id`
# is valid and `app-id` is not required.
run = '''
actionlint \
    -ignore 'missing input "app-id".+create-github-app-token' \
    -ignore 'input "client-id" is not defined.+create-github-app-token'
'''

[tasks."lint:yaml"]
description = "Lint the tracked YAML with yamllint, per .yamllint.yaml"

# Fed from git ls-files rather than run as `yamllint .`, which would walk
# node_modules/ and .bin/. --strict fails on warnings as well as errors.
run = "git ls-files -z '*.yaml' '*.yml' | xargs -0 -r yamllint --strict"

[tasks."lint:types"]
description = "Typecheck .commitlintrc.mts"
run = "bunx --bun --no-install tsc"

[tasks."lint:format"]
description = "Check that neither formatter would rewrite anything"

# The read-only counterpart to the fmt task, in the same order.
run = [
    "shuck format --check",
    "bunx --bun --no-install prettier --check .",
]

[tasks."lint:commit"]
description = "Lint the most recent commit message against Conventional Commits"
run = "bunx --bun --no-install commitlint --last --verbose"


# ------
# Tests
# ------

[tasks.test]
description = "Run the zunit suite against a throwaway HOME"
depends = ["test:deps"]

# Deliberately not a dependency of the lint task, and lint is not a dependency
# of this one. lint reads the working tree and nothing else, whereas this spawns
# real shells against a scratch HOME, so the two are worth being able to run
# apart. The pre-commit hook runs both.
#
# --tap rather than the default reporter. Without it zunit drives an animated
# spinner through revolver, which redraws over itself when stdout is not a
# terminal and leaves a hook or a CI log unreadable.
run = "zunit run --tap tests"

[tasks."test:deps"]
description = "Fetch the pinned zunit and revolver test binaries"
shell = "zsh -c"

# Neither tool can come from the tools table. zunit is absent from the mise
# registry and publishes one generic release asset rather than the
# platform-tagged set the github: backend matches on, and revolver publishes no
# release assets whatsoever. Both are single zsh scripts, so they are fetched
# from a pinned tag and checked against a recorded sha256 rather than trusted:
# a silently substituted test runner would mean silently wrong test results.
#
# revolver is not optional. zunit's entry point runs `type revolver` and exits
# before it parses a single option, so it is required even with tap output.
run = '''
() {
    emulate -L zsh

    local -A source=(
        [zunit]="https://github.com/zunit-zsh/zunit/releases/download/v0.8.2/zunit"
        [revolver]="https://raw.githubusercontent.com/molovo/revolver/v0.2.3/revolver"
    )

    local -A checksum=(
        [zunit]="8169b4df60da7b7a7d55a7b6ab44b068b318989b75e4cacf9aec27d8d3a9dd0f"
        [revolver]="1deb124ae0b66ff3ee109ca64b20a72775ed12bde2ed0c192cf15e732b831966"
    )

    local bin="$PWD/.bin"
    mkdir -p -- "$bin" || return 1

    local tool dest want got
    local -i failed=0

    for tool in ${(ko)source}; do
        dest="$bin/$tool"
        want="$checksum[$tool]"

        # Tested with -s rather than -e. An interrupted download leaves a
        # zero-byte file behind, and treating that as installed is how a
        # broken runner gets invoked in silence.
        if [[ -s "$dest" ]]; then
            got="$(sha256sum -- "$dest" | cut -d " " -f 1)"
            [[ "$got" == "$want" ]] && continue
        fi

        print -u2 -- "test:deps: Fetching $tool"

        if ! curl --fail --silent --show-error --location \
            --output "$dest" -- "$source[$tool]"; then
            print -u2 -- "test:deps: [ERROR] Download failed: $tool"
            failed=1
            continue
        fi

        got="$(sha256sum -- "$dest" | cut -d " " -f 1)"

        if [[ "$got" != "$want" ]]; then
            print -u2 -- "test:deps: [ERROR] Checksum mismatch: $tool"
            print -u2 -- "  expected $want"
            print -u2 -- "  actual   $got"
            rm -f -- "$dest"
            failed=1
            continue
        fi

        chmod u+x -- "$dest" || failed=1
    done

    return $failed
}
'''


# -----------
# Formatting
# -----------

[tasks.fmt]
description = "Format every file in place"
depends = ["fmt:zsh", "fmt:prettier"]

[tasks."fmt:zsh"]
description = "Format the shell sources with shuck, per .shuck.toml"
run = "shuck format"

[tasks."fmt:prettier"]
description = "Format the non-shell files with Prettier"
run = "bunx --bun --no-install prettier --write ."
